spring.application.name=trip-service
server.port=8081

spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.service-name=trip-service
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-url=${CONSUL_HEALTH_CHECK_URL:http://trip-service:8081/actuator/health}

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${TRIP_DB_URL:jdbc:postgresql://trip-db:5432/trip_db}
spring.datasource.username=${TRIP_DB_USERNAME:trip_user}
spring.datasource.password=${TRIP_DB_PASSWORD:trip_pass}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topics.trip-created=${TRIP_CREATED_TOPIC:trip-created}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8086/realms/smart-travel}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/smart-travel/protocol/openid-connect/certs}