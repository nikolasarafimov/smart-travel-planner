spring.application.name=mcp-server
server.port=8087

spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.service-name=mcp-server
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-url=${CONSUL_HEALTH_CHECK_URL:http://mcp-server:8087/actuator/health}

management.endpoints.web.exposure.include=health,info

spring.ai.mcp.server.name=smart-travel-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true

smart-travel.gateway-url=${SMART_TRAVEL_GATEWAY_URL:http://api-gateway:8080}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8086/realms/smart-travel}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/smart-travel/protocol/openid-connect/certs}

keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://keycloak:8080/realms/smart-travel/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:mcp-server-client}
keycloak.client-secret=${MCP_CLIENT_SECRET}